name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: foundation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foundation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/foundation_ci
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      # Node is installed first, without a pnpm cache: setup-node cannot resolve a pnpm
      # store path before pnpm exists, and the runner's preinstalled Node provides the
      # corepack shim used to enable the exact pinned pnpm version below.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          corepack pnpm --version
      - name: Install frozen workspace
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Check formatting
        run: corepack pnpm format:check
      - name: Unit and integration tests
        run: corepack pnpm test
      - name: Negative-path quality gates
        run: corepack pnpm test:quality
      - name: Contract drift check
        run: corepack pnpm contract:check
      - name: Browser smoke
        run: |
          corepack pnpm --filter ./apps/web exec playwright install --with-deps chromium
          corepack pnpm test:e2e
      - name: Independent production builds
        run: corepack pnpm build
